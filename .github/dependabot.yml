version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR per week instead of one per package.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint does not support TS 7 yet (tracked in #63).
      - dependency-name: typescript
        update-types: [version-update:semver-major]
